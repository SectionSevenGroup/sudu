{
 "@context": "https://schema.org",
 "@type": "FAQPage",
 "mainEntity": [
  {
   "@type": "Question",
   "name": "What types of projects do you take on?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Residential, hospitality, retail, commercial, and community work, from concept studies to full architectural services. No project is too early: some of our best work starts as a feasibility question."
   }
  },
  {
   "@type": "Question",
   "name": "Where do you work?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "The studio is based in Alberta, with projects across Western Canada and select work beyond. Distance has never been the deciding factor."
   }
  },
  {
   "@type": "Question",
   "name": "How does a project start?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "With a conversation. We then scope a concept phase first, so you can see a direction, a budget picture, and how we work together before committing to the full journey."
   }
  },
  {
   "@type": "Question",
   "name": "Do you handle both architecture and interiors?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Yes, and branded environments too. The work is strongest when one team holds the building, the interior, and the brand as a single idea."
   }
  },
  {
   "@type": "Question",
   "name": "What does engaging SuDu cost?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Fees are scoped per project: fixed for defined phases, transparent throughout. An initial conversation costs nothing."
   }
  },
  {
   "@type": "Question",
   "name": "Do you work with existing consultants or builders?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Regularly. We collaborate with allied practices, including MES Architecture and DIALOG, and we are comfortable joining teams a client has already assembled."
   }
  }
 ]
}

  renderVals() {
    const TREE = [
      { label: 'Architecture', subs: ['New Build', 'Renovation', 'Addition', 'Feasibility'] },

      { label: 'Branded Environments', subs: ['Brand Integration', 'Naming', 'Signage & Wayfinding'] },
      { label: 'Concept Study', subs: ['Massing Study', 'Site Study', 'Visualization'] },
      { label: 'Hospitality & Retail', subs: ['Restaurant / Bar', 'Retail Space', 'Guest Experience'] },
      { label: 'Advisory', subs: ['Design Direction', 'Developer Advisory', 'Peer Review'] }
    ];
    const FAQS = [
      { q: 'What types of projects do you take on?', a: 'Residential, hospitality, retail, commercial, and community work, from concept studies to full architectural services. No project is too early: some of our best work starts as a feasibility question.' },
      { q: 'Where do you work?', a: 'The studio is based in Alberta, with projects across Western Canada and select work beyond. Distance has never been the deciding factor.' },
      { q: 'How does a project start?', a: 'With a conversation. We then scope a concept phase first, so you can see a direction, a budget picture, and how we work together before committing to the full journey.' },
      { q: 'Do you handle both architecture and interiors?', a: 'Yes, and branded environments too. The work is strongest when one team holds the building, the interior, and the brand as a single idea.' },
      { q: 'What does engaging SuDu cost?', a: 'Fees are scoped per project: fixed for defined phases, transparent throughout. An initial conversation costs nothing.' },
      { q: 'Do you work with existing consultants or builders?', a: 'Regularly. We collaborate with allied practices, including MES Architecture and DIALOG, and we are comfortable joining teams a client has already assembled.' }
    ];
    const { sel, sub, open } = this.state;
    const toggleCat = (label) => this.setState(s => {
      const on = s.sel.includes(label);
      const cat = TREE.find(t => t.label === label);
      return {
        sel: on ? s.sel.filter(x => x !== label) : [...s.sel, label],
        sub: on ? s.sub.filter(x => !cat.subs.includes(x)) : s.sub
      };
    });
    return {
      chips: TREE.map(t => {
        const on = sel.includes(t.label);
        return { label: t.label, pressed: on ? 'true' : 'false', bg: on ? '#171613' : 'transparent', fg: on ? '#F3F1EA' : '#171613', toggle: () => toggleCat(t.label) };
      }),
      hasSubs: sub.length > 0,
      subSummary: sub.length ? 'Including: ' + sub.join(', ') : '',
      faqs: FAQS.map((f, i) => ({
        ...f, pressed: open === i ? 'true' : 'false', disp: open === i ? 'block' : 'none', rot: open === i ? 'rotate(90deg)' : 'rotate(0deg)',
        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i }))
      })),
      submit: (e) => {
        e.preventDefault();
        const form = e.target;
        const name = (form.name && form.name.value) || '';
        const interests = this.state.sel.join(', ');
        const details = this.state.sub.join(', ');
        const subject = 'Project inquiry' + (interests ? ' \u2014 ' + interests : '') + (name ? ' (' + name + ')' : '');
        const lines = [];
        if (interests) lines.push('Interested in: ' + interests);
        if (details) lines.push('Specifically: ' + details);
        if (form.body && form.body.value) lines.push('', form.body.value);
        if (name) lines.push('', name + (form.email && form.email.value ? ' \u2014 ' + form.email.value : ''));
        if (window.suduHaptics) window.suduHaptics.tick(14);
        window.location.href = 'mailto:joe@sudu.studio?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(lines.join('\n'));
      }
    };
  }
}
</script>
