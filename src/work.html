     document head rather than in the body: Turbo re-activates every script
     in the body it swaps in, and a router tag there started a second Turbo
     Session on every navigation. Head scripts whose markup is unchanged are
     carried across a visit untouched and execute exactly once.
     The coordinator is listed first on purpose. Turbo scans for preload
     links the moment its own script runs, and the coordinator is what
     withdraws those links on a metered connection. -->
