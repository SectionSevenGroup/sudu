<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "FAQPage",
 "mainEntity": [
  {
   "@type": "Question",
   "name": "What types of projects do you take on?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Residential, hospitality, retail, commercial, and community work, from concept studies to full architectural services. No project is too early: some of our best work starts as a feasibility question."
   }
  }, {
   "@type": "Question",
   "name": "Where do you work?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "The studio is based in Alberta, with projects across Western Canada and select work beyond. Distance has never been the deciding factor."
   }
  }, {
   "@type": "Question",
   "name": "How does a project start?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "With a conversation. We then scope a concept phase first, so you can see a direction, a budget picture, and how we work together before committing to the full journey."
   }
  }, {
   "@type": "Question",
   "name": "Do you handle both architecture and interiors?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Yes, and branded environments too. The work is strongest when one team holds the building, the interior, and the brand as a single idea."
   }
  }, {
   "@type": "Question",
   "name": "What does engaging SuDu cost?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Fees are scoped per project: fixed for defined phases, transparent throughout. An initial conversation costs nothing."
   }
  }, {
   "@type": "Question",
   "name": "Do you work with existing consultants or builders?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Regularly. We collaborate with allied practices, including MES Architecture and DIALOG, and we are comfortable joining teams a client has already assembled."
   }
  }
 ]
}
</script>

<!-- The router and its coordinator are singletons, so they live in the
     document head rather than in the body: Turbo re-activates every script
     in the body it swaps in, and a router tag there started a second Turbo
     Session on every navigation. Head scripts whose markup is unchanged are
     carried across a visit untouched and execute exactly once.
     The coordinator is listed first on purpose. Turbo scans for preload
     links the moment its own script runs, and the coordinator is what
     withdraws those links on a metered connection. -->
<script src="js/turbo-boot.js?v=4b3e0932" defer></script>
<script src="js/vendor/turbo.es2017-umd.js?v=f9e09e3a" integrity="sha384-2ePXINFSJiSCWUJkjFJGYdr2kyM132s7uBi9k+JISp4P+AjN9DXn4H/1enWEHu36" defer></script>
<!-- One render per application visit. no-preview stops Turbo showing the
     cached copy of a page before the fresh response arrives, which is what
     made a revisit play two arrivals. It is deliberately not no-cache:
     snapshots are still stored, and Back/Forward still restores from them. -->
<meta name="turbo-cache-control" content="no-preview">
<link rel="preload" as="font" type="font/woff2" href="/fonts/urbanist-latin.woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css?v=4531729b">
<style>
  html { background: var(--ground); }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: 'Urbanist', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }

  /* One arrow language across the site. Contact's controls use the same
     Urbanist single chevron the homepage already uses (U+203A), sized and
     spaced here rather than coloured inline: the glyph belongs to the text it
     sits beside, so it inherits that text's colour and follows every theme
     without an override. Authored here on purpose — an earlier attempt kept
     the orange inline and tried to beat it from a build-injected stylesheet,
     which only held as long as that stylesheet reached the page. */
  .sudu-chevron {
    flex: none;
    font-family: 'Urbanist', sans-serif;
    font-weight: 700;
    letter-spacing: -0.12em;
    line-height: 1;
    color: currentColor;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.2em;
    height: 1.2em;
  }
  .sudu-chevron--faq { font-size: 20px; transition: transform .3s ease; }
  .sudu-chevron--send { font-size: 18px; }

  /* The interest map's selected states. The markup is emitted at rest and
     js/contact.js toggles these classes; the values are the ones the page's
     Component used to write into the style attribute, so they carry
     !important to beat the resting inline value. A branch's position,
     opacity and stagger are written inline by the script from the data
     attributes, because they differ per element. The chip's selected ink is
     #F5F3EC, not #F3F1EA — see the note on the chips in the Component. */
  /* The resting fill is stated here, not inline: an inline #F3F1EA is the
     sentinel the build reads to tag cream grounds, and a branch is a control,
     not a ground. Selected fills are inline-safe values and stay below. */
  [data-mind-map] [data-node] { background:var(--ground); }
  form[name="contact"] [data-chip].is-active { background:var(--ink) !important; color:var(--ground) !important; }
  [data-mind-map] [data-node="cat"].is-active { border-color:var(--ink) !important; background:var(--ink) !important; color:var(--ground) !important; }
  [data-mind-map] [data-node="sub"].is-on { border-color:var(--accent) !important; background:var(--accent) !important; color:var(--ground) !important; }
  [data-mind-map] line[data-link="cat"].is-active { stroke:var(--rule-55); stroke-width:0.22; }
  [data-mind-map] line[data-link="sub"] { opacity:0; }
  [data-mind-map] line[data-link="sub"].is-active { opacity:1; }
  [data-mind-map] line[data-link="sub"].is-on { stroke:rgba(225,123,62,0.75); stroke-width:0.22; }
  a:hover { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--ground); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  input::placeholder, textarea::placeholder { color: var(--faint); opacity: 1; }
  @keyframes webPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Ground, blur, border and ink for all three pills now come from the chrome
     bar (js/chrome-bar.js), which states them once for every theme instead of
     each pill restating them. What stays here is the swatch buttons. */
  #dmSwatches { display:flex !important; }
  #dmSwatches button { box-shadow:none !important; border:0 !important; }
  html.xh, html.xh * { cursor:none !important; }
  #xhair { position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; z-index:99998; will-change:transform; }
  #xhair i { position:absolute; display:block; }
  #xhair { --len:16px; --gap:5px; }
  #xhair i { opacity:0.72; }
  #xhair i:nth-child(1), #xhair i:nth-child(2) { width:1px; left:-0.5px; height:var(--len); transform:scaleX(0.75); }
  #xhair i:nth-child(1) { top:calc(-1 * (var(--len) + var(--gap))); background:linear-gradient(to bottom, transparent 0%, var(--xh) 34%); }
  #xhair i:nth-child(2) { top:var(--gap); background:linear-gradient(to top, transparent 0%, var(--xh) 34%); }
  #xhair i:nth-child(3), #xhair i:nth-child(4) { height:1px; top:-0.5px; width:var(--len); transform:scaleY(0.75); }
  #xhair i:nth-child(3) { left:calc(-1 * (var(--len) + var(--gap))); background:linear-gradient(to right, transparent 0%, var(--xh) 34%); }
  #xhair i:nth-child(4) { left:var(--gap); background:linear-gradient(to left, transparent 0%, var(--xh) 34%); }
  #langSwitch button { position:relative; }
  #langSwitch button::after { content:""; position:absolute; inset:-12px -6px; }
  

  /* header/footer chrome: declared last, single source of truth */
  /* burnt/charcoal: every footer rule, divider and glyph is off white — no greys */
  /* placeholders are pseudo-elements, so * never reached them */
  /* one hairline weight everywhere: chips, field underlines, dividers, section rules */
  section, section *, footer, footer *, header, header * { border-width:0.5px; }


  /* A disabled submit — while sending, and once sent — should not take the
     hover fill at all. Returning it to the idle pairing keeps the completed
     label legible on the plain ground in all three themes, including when the
     pointer is still on the button from the click that sent the form. */
  form[name="contact"] button[type="submit"]:disabled:hover { background:transparent !important; color:var(--ink) !important; }

  /* Safari paints an opaque block behind an autofilled field, which on Burnt
     reads as a black rectangle cutting across the underline fields. Clipping
     the background to the glyphs keeps the field transparent, so it stays part
     of the underline system, and letting the ink follow the resolved colour
     keeps all three grounds coherent. Autofill itself is untouched, and a
     field that is not autofilled never matches these selectors. */
  form[name="contact"] input:-webkit-autofill,
  form[name="contact"] input:-webkit-autofill:hover,
  form[name="contact"] input:-webkit-autofill:focus,
  form[name="contact"] input:-webkit-autofill:active {
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:currentColor; caret-color:currentColor;
    transition:background-color 100000s ease-in-out 0s;
  }
</style>

<body>
<div data-theme-surface="cream" style="background:var(--ground); color:var(--ink); font-family:'Urbanist', sans-serif; min-height:100svh; display:flex; flex-direction:column;">

  <header data-theme-surface="cream" style="position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:34px clamp(20px,4.5vw,64px) 30px; background:rgba(243,241,234,0.94);">
    <a href="/" data-turbo-preload style="display:flex; align-items:flex-end; gap:12px;">
      <img src="images/sudu-mark.png" width="1856" height="660" alt="SuDu Studio" style="height:38px; width:auto; display:block;">
    </a>
    <nav style="display:flex; align-items:flex-end; gap:clamp(16px,2.6vw,30px);">
      <a href="/work" data-turbo-preload style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid transparent; transition:border-color .3s ease, color .3s ease;" style-hover="border-bottom-color:var(--accent); color:var(--accent);">Work</a>
      <a href="/studio" data-turbo-preload style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid transparent; transition:border-color .3s ease, color .3s ease;" style-hover="border-bottom-color:var(--accent); color:var(--accent);">Studio</a>
      <a href="/contact" data-turbo-preload style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid transparent;">Contact</a></nav>
  </header>

  <section data-screen-label="Contact" style="flex:1; padding:clamp(104px,13vh,140px) clamp(20px,4.5vw,64px) clamp(40px,5vw,64px);">
    <div style="font-family:'Urbanist', sans-serif; font-size:10.5px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:20px;">Start a project</div>
    <h1 style="font-size:clamp(26px,3.4vw,44px); font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin:0; max-width:24ch; "><span data-i18n="contact.openingLineOne">{{ copy.openingLineOne }}</span><br><span data-i18n="contact.openingLineTwo">{{ copy.openingLineTwo }}</span></h1>

    <div style="display:flex; flex-wrap:wrap; gap:40px 64px; margin-top:clamp(32px,4vw,48px);">

      <div style="flex:1 1 400px; max-width:560px;">
        <!-- Netlify reads a form's definition out of the deployed HTML, so every
             field that gets submitted has to be declared here by name. The two
             interest selections are chips, not inputs, so they ride along in
             hidden fields; form-name is written out rather than left to
             Netlify's injector, so the form Netlify registered at deploy and
             the one the visitor submits are the same markup.
             data-turbo="false" keeps Turbo Drive out of the submit path.
             The honeypot is visually hidden rather than display:none, so a bot
             reading computed styles still finds a real, fillable field. It is
             absolutely positioned, so it is not a flex item and adds no gap;
             tabindex="-1" keeps it out of the tab order and aria-hidden keeps
             it out of the accessibility tree. -->
        <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" data-turbo="false" style="display:flex; flex-direction:column; gap:24px;">
          <input type="hidden" name="form-name" value="contact">
          <input type="hidden" name="interests" value="">
          <input type="hidden" name="sub-interests" value="">
          <p aria-hidden="true" style="position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;"><label>Leave this field empty <input name="bot-field" tabIndex="-1" autoComplete="off"></label></p>

          <div style="display:flex; flex-direction:column; gap:10px;">
            <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">I'm interested in</span>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <sc-for list="{{ chips }}" as="chip">
                <button type="button" data-chip="{{ chip.label }}" aria-pressed="false" style="border:1px solid var(--rule-32); background:transparent; color:var(--ink); padding:9px 16px; font-family:'Urbanist', sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:background .25s ease, color .25s ease, border-color .25s ease;" style-hover="border-color:var(--ink);">{{ chip.label }}</button>
              </sc-for>
            </div>
            <div data-sub-summary hidden style="font-family:'Urbanist', sans-serif; font-size:11px; color:var(--muted); line-height:1.6;"></div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:22px;">
            <label style="display:flex; flex-direction:column; gap:8px;">
              <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">Name</span>
              <input type="text" name="name" required="required" autoComplete="name" placeholder="Your name" style="border:0; border-bottom:1px solid var(--rule-32); background:transparent; padding:8px 0; font-family:'Urbanist', sans-serif; font-size:15px; color:var(--ink); outline-offset:6px;">
            </label>
            <label style="display:flex; flex-direction:column; gap:8px;">
              <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">Email</span>
              <input type="email" name="email" required="required" autoComplete="email" placeholder="you@email.com" style="border:0; border-bottom:1px solid var(--rule-32); background:transparent; padding:8px 0; font-family:'Urbanist', sans-serif; font-size:15px; color:var(--ink); outline-offset:6px;">
            </label>
          </div>
          <label style="display:flex; flex-direction:column; gap:8px;">
            <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint);">About the project</span>
            <textarea name="body" rows="4" required="required" placeholder="Site, scope, timeline, budget range, and what you are hoping to build." style="border:0; border-bottom:1px solid var(--rule-32); background:transparent; padding:8px 0; font-family:'Urbanist', sans-serif; font-size:15px; line-height:1.7; color:var(--ink); resize:vertical; outline-offset:6px;"></textarea>
          </label>
          <button type="submit" style="align-self:flex-start; display:inline-flex; align-items:center; gap:12px; border:1px solid var(--ink); background:transparent; padding:13px 26px; font-family:'Urbanist', sans-serif; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink); cursor:pointer; transition:background .3s ease, color .3s ease, border-color .3s ease;" style-hover="background:var(--ink); color:var(--ground);">Send inquiry <span aria-hidden="true" class="sudu-chevron sudu-chevron--send">&#8250;</span></button>
          <p role="status" aria-live="polite" style="margin:0; font-family:'Urbanist', sans-serif; font-size:10.5px; color:var(--faint);"><span style="display:none; margin-bottom:5px; color:var(--ink);"></span><span data-i18n="contact.formNote">{{ copy.formNote }}</span><a href="mailto:joe@sudu.studio" style="color:var(--muted); border-bottom:1px solid var(--rule-22);">joe@sudu.studio</a></p>
        </form>
      </div>

      <div style="display:none; flex:1 1 380px; max-width:520px; align-self:center; flex-direction:column; gap:12px;">
        <!-- Every node and every link is in the page from the start, in its
             inactive state, with the polar geometry it needs on data
             attributes: a branch's own position (data-x, data-y), the position
             of the category it folds back into (data-cx, data-cy) and its
             stagger (data-delay). js/contact.js only toggles classes and
             copies those values into place; it never recomputes a position. -->
        <div data-mind-map style="position:relative; width:100%; max-width:460px; margin:0 auto; aspect-ratio:1; min-height:340px;">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible;">
            <sc-for list="{{ links }}" as="ln">
              <line data-link="{{ ln.kind }}" data-category="{{ ln.category }}" data-sub="{{ ln.sub }}" x1="{{ ln.x1 }}" y1="{{ ln.y1 }}" x2="{{ ln.x2 }}" y2="{{ ln.y2 }}" stroke="rgba(23,22,19,0.16)" stroke-width="0.16" style="transition:all .7s cubic-bezier(.16,1,.3,1);"></line>
            </sc-for>
          </svg>
          <div data-theme-surface="cream" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px; border-radius:50%; border:1px solid var(--rule-35); display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; font-weight:600; letter-spacing:0.01em; background:var(--ground); z-index:2; animation:webPulse 5s ease-in-out infinite;">Project</div>
          <sc-for list="{{ nodes }}" as="nd">
            <button type="button" data-node="{{ nd.kind }}" data-category="{{ nd.category }}" data-sub="{{ nd.sub }}" data-x="{{ nd.x }}" data-y="{{ nd.y }}" data-cx="{{ nd.cx }}" data-cy="{{ nd.cy }}" data-delay="{{ nd.delay }}" style="position:absolute; left:{{ nd.cx }}%; top:{{ nd.cy }}%; transform:{{ nd.tr }}; opacity:{{ nd.op }}; pointer-events:{{ nd.pe }}; z-index:{{ nd.z }}; border:1px solid {{ nd.border }}; border-radius:999px; color:{{ nd.fg }}; padding:{{ nd.pad }}; font-family:'Urbanist', sans-serif; font-size:{{ nd.fs }}; font-weight:600; white-space:nowrap; cursor:pointer; transition:left .8s cubic-bezier(.34,1.4,.44,1), top .8s cubic-bezier(.34,1.4,.44,1), transform .5s cubic-bezier(.34,1.4,.44,1), opacity .45s ease, background .25s ease, color .25s ease, border-color .25s ease; transition-delay:0ms;" style-hover="transform:translate(-50%,-50%) scale(1.06); transition-delay:0ms;">{{ nd.label }}</button>
          </sc-for>
        </div>
        <div style="font-family:'Urbanist', sans-serif; font-size:10.5px; color:var(--faint); text-align:center;" data-i18n="contact.mindMapNote">{{ copy.mindMapNote }}</div>
      </div>

    </div>
  </section>

  <section data-screen-label="FAQ" style="padding:clamp(40px,5vw,64px) clamp(20px,4.5vw,64px) clamp(56px,7vw,88px); border-top:1px solid var(--rule-13);">
    <div style="display:flex; flex-direction:column; gap:24px;">
      <span style="font-family:'Urbanist', sans-serif; font-size:10.5px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);">Common questions</span>
      <div style="max-width:760px;">
        <sc-for list="{{ faqs }}" as="faq">
          <div style="border-bottom:1px solid var(--rule-13);">
            <button type="button" aria-expanded="false" style="width:100%; display:flex; align-items:baseline; justify-content:space-between; gap:20px; border:0; background:transparent; padding:18px 0; font-family:'Urbanist', sans-serif; font-size:15px; font-weight:600; letter-spacing:-0.01em; color:var(--ink); text-align:left; cursor:pointer;">
              <span data-i18n="{{ faq.qKey }}">{{ faq.q }}</span>
              <span aria-hidden="true" class="sudu-chevron sudu-chevron--faq" style="transform:rotate(0deg);">&#8250;</span>
            </button>
            <div data-i18n="{{ faq.aKey }}" style="display:none; padding:0 0 20px; max-width:62ch; font-size:14px; line-height:1.7; color:var(--muted);">{{ faq.a }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>


  <footer style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px 24px; padding:20px clamp(20px,4.5vw,64px) 28px; border-top:1px solid var(--rule-13); font-family:'Urbanist', sans-serif; font-size:10.5px; color:var(--faint);; padding-bottom:64px">
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="images/sudu-mark.png" width="1856" height="660" alt="SuDu Studio" style="height:19px; width:auto; display:block; opacity:0.85;">
      <span style="width:1px; height:14px; background:var(--rule-22);"></span>
      <span>&copy; 2026 SuDu Studio Architecture</span>
    </div><span>Alberta</span>
  </footer>

</div>

<script type="text/plain" data-page-script>
class Component {
  // The authored copy of this page, in one place, so SuDu Control can edit it
  // and so each string has a stable identity. The markup binds to these names
  // and carries the matching data-i18n key, which is what i18n.js translates
  // against — never the English sentence itself, which is the thing that
  // changes when someone edits the page.
  static COPY = {
    faqs: [
      { q: 'What types of projects do you take on?', a: 'Residential, hospitality, retail, commercial, and community work, from concept studies to full architectural services. No project is too early: some of our best work starts as a feasibility question.' }, { q: 'Where do you work?', a: 'The studio is based in Alberta, with projects across Western Canada and select work beyond. Distance has never been the deciding factor.' }, { q: 'How does a project start?', a: 'With a conversation. We then scope a concept phase first, so you can see a direction, a budget picture, and how we work together before committing to the full journey.' }, { q: 'Do you handle both architecture and interiors?', a: 'Yes, and branded environments too. The work is strongest when one team holds the building, the interior, and the brand as a single idea.' }, { q: 'What does engaging SuDu cost?', a: 'Fees are scoped per project: fixed for defined phases, transparent throughout. An initial conversation costs nothing.' }, { q: 'Do you work with existing consultants or builders?', a: 'Regularly. We collaborate with allied practices, including MES Architecture and DIALOG, and we are comfortable joining teams a client has already assembled.' }
    ],
    openingLineOne: 'Every project begins',
    openingLineTwo: 'with a conversation.',
    formNote: 'Sends straight to the studio, or write us directly at ',
    mindMapNote: 'Select an interest to explore what it can include, then tap the branches that fit.',
  };

  renderVals() {
    const copy = Component.COPY;
    const TREE = [
      { label: 'Architecture', subs: ['New Build', 'Renovation', 'Addition', 'Feasibility'] }, { label: 'Interiors', subs: ['Full Interiors', 'Millwork', 'Material Direction'] }, { label: 'Branded Environments', subs: ['Brand Integration', 'Naming', 'Signage & Wayfinding'] }, { label: 'Concept Study', subs: ['Massing Study', 'Site Study', 'Visualization'] }, { label: 'Hospitality & Retail', subs: ['Restaurant / Bar', 'Retail Space', 'Guest Experience'] }, { label: 'Advisory', subs: ['Design Direction', 'Developer Advisory', 'Peer Review'] }
    ];
    const FAQS = Component.COPY.faqs;
    const n = TREE.length;
    const pos = (angleDeg, r) => {
      const a = (angleDeg - 90) * Math.PI / 180;
      return { x: 50 + r * Math.cos(a), y: 50 + r * Math.sin(a) };
    };
    // The whole map, at rest. Every category and every branch is emitted, a
    // branch sitting folded on its category (data-cx, data-cy) with its own
    // position (data-x, data-y) and stagger (data-delay) alongside, so
    // js/contact.js moves it without doing this arithmetic again. The
    // selected values live in the page's stylesheet as classes.
    const nodes = [];
    const links = [];
    TREE.forEach((cat, i) => {
      const ang = i * (360 / n);
      const p = pos(ang, 30);
      links.push({ kind: 'cat', category: cat.label, sub: '', x1: 50, y1: 50, x2: p.x.toFixed(2), y2: p.y.toFixed(2) });
      nodes.push({
        kind: 'cat', category: cat.label, sub: '', label: cat.label,
        x: p.x.toFixed(2), y: p.y.toFixed(2), cx: p.x.toFixed(2), cy: p.y.toFixed(2), delay: 0,
        op: '1', pe: 'auto', z: '3', tr: 'translate(-50%,-50%) scale(1)',
        border: 'var(--rule-32)', fg: 'var(--ink)', pad: '8px 14px', fs: '11px'
      });
      cat.subs.forEach((s, j) => {
        const step = 20;
        const spread = (cat.subs.length - 1) * step;
        const sAng = ang - spread / 2 + j * step;
        const r = j % 2 === 0 ? 43 : 51;
        const a2 = (sAng - 90) * Math.PI / 180;
        const sp = { x: 50 + r * Math.cos(a2), y: 50 + r * 0.84 * Math.sin(a2) };
        links.push({ kind: 'sub', category: cat.label, sub: s, x1: p.x.toFixed(2), y1: p.y.toFixed(2), x2: sp.x.toFixed(2), y2: sp.y.toFixed(2) });
        nodes.push({
          kind: 'sub', category: cat.label, sub: s, label: s,
          x: sp.x.toFixed(2), y: sp.y.toFixed(2), cx: p.x.toFixed(2), cy: p.y.toFixed(2), delay: j * 70,
          op: '0', pe: 'none', z: '2', tr: 'translate(-50%,-50%) scale(0.4)',
          border: 'var(--rule-25)', fg: 'var(--muted)', pad: '5px 11px', fs: '10px'
        });
      });
    });
    return {
      copy,
      nodes, links,
      // The chips are buttons, so their selections reach Netlify through the
      // two hidden fields declared in the form.
      chips: TREE.map(t => ({ label: t.label })),
      faqs: FAQS.map((f, i) => ({
        ...f, qKey: 'contact.faq.' + i + '.question', aKey: 'contact.faq.' + i + '.answer'
      }))
    };
  }
}
</script>
</body>
</html>
