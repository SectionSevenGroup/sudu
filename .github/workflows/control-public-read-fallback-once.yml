name: Control public read fallback once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make public repository reads independent of PAT permissions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/github.mjs')
          s = p.read_text()
          start = s.index("  async function call(path, options = {}) {")
          marker = "    const text = await res.text();"
          end = s.index(marker, start) + len(marker)
          new = '''  async function call(path, options = {}) {
            const method = String(options.method || 'GET').toUpperCase();
            const request = (authenticated) => fetch(API + path, {
              ...options,
              signal: options.signal || AbortSignal.timeout(10000),
              headers: {
                Accept: 'application/vnd.github+json',
                ...(authenticated && env.GITHUB_TOKEN ? { Authorization: 'Bearer ' + env.GITHUB_TOKEN } : {}),
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'sudu-control',
                ...(options.headers || {}),
              },
            });
            let res = await request(true);
            // SuDu is public. If a fine-grained PAT is rejected on a read
            // endpoint, retry that GET anonymously. Writes never retry and
            // still require the PAT.
            if (method === 'GET' && (res.status === 401 || res.status === 403)) {
              res = await request(false);
            }
            const text = await res.text();'''
          p.write_text(s[:start] + new + s[end:])
          PY
          git rm .github/workflows/control-public-read-fallback-once.yml
          git add lib/github.mjs
          git commit -m "Let Control read the public site without PAT permission coupling"
          git push origin HEAD:main
