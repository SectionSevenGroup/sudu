name: Apply clean homepage title

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-document-title-v2.yml'

permissions:
  contents: write

jobs:
  patch-title:
    if: github.event.head_commit.message == 'chore: apply clean homepage title'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch title
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>SuDu Studio | Architecture + Interior Design | Edmonton, Alberta</title>'
          new = '<title>SuDu Studio Architecture</title>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected title not found')
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update homepage document title"
          git push origin HEAD:main
