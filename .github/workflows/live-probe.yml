# DIAGNOSTIC ONLY - delete after use.
name: Probe the live site
on:
  workflow_dispatch:
  push:
    branches: [claude/live-probe-uhnpgt]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live language switcher
        run: |
          B=https://sudu.studio
          echo "########## live i18n.js ##########"
          curl -sS -o /tmp/i18n.js -D /tmp/h --max-time 30 "$B/i18n.js"
          tr -d '\r' < /tmp/h | grep -iE '^(HTTP/|cache-control:|etag:|last-modified:|content-length:)' | sed 's/^/    /'
          echo "    bytes=$(wc -c < /tmp/i18n.js)"
          echo
          echo "  positioned pill present?  $(grep -c 'position:fixed;left:clamp' /tmp/i18n.js)"
          echo "  skips active language?    $(grep -c 'if(l===cur)return;' /tmp/i18n.js)"
          echo "  appends to body?          $(grep -c 'document.body.appendChild(wrap)' /tmp/i18n.js)"
          echo "  OLD footer append?        $(grep -c 'nav.appendChild(wrap)' /tmp/i18n.js)"
          echo
          echo "########## how index.html loads it ##########"
          curl -sS --max-time 30 "$B/" | grep -o '<script src="i18n.js[^>]*>' | sed 's/^/    /'
          echo
          echo "########## other cache-busted assets for comparison ##########"
          curl -sS --max-time 30 "$B/" | grep -oE 'src="[^"]*\.js\?v=[0-9]+"|src="[^"]*\.js"' | sort -u | sed 's/^/    /'
