name: One-off homepage share metadata update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-share-title.yml'

permissions:
  contents: write

jobs:
  patch-homepage-share-metadata:
    if: "${{ github.event.head_commit.message == 'chore: one-off update share title' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch social share metadata only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = '<meta property="og:title" content="SuDu Studio | Architecture + Interior Design | Edmonton, Alberta">'
          new_title = '<meta property="og:title" content="SuDu Studio Architecture">'
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif new_title not in text:
              raise SystemExit('Expected og:title not found; refusing to edit index.html')

          old_desc = '<meta property="og:description" content="SuDu Studio is an Edmonton-based architecture and interior design practice. Custom homes, renovations, hospitality, retail and commercial design across Alberta and Western Canada.">'
          new_desc = '<meta property="og:description" content="Architecture, interiors and design.">'
          if old_desc in text:
              text = text.replace(old_desc, new_desc, 1)
          elif new_desc not in text:
              raise SystemExit('Expected og:description not found; refusing to edit index.html')

          image_line = '<meta property="og:image" content="https://sudu.studio/images/og-sudu-logo.jpg">'
          social_block = '''<meta property="og:image" content="https://sudu.studio/images/og-sudu-logo.jpg">\n<meta property="og:site_name" content="SuDu Studio Architecture">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="SuDu Studio Architecture">\n<meta name="twitter:description" content="Architecture, interiors and design.">\n<meta name="twitter:image" content="https://sudu.studio/images/og-sudu-logo.jpg">'''
          if '<meta name="twitter:title" content="SuDu Studio Architecture">' not in text:
              if image_line not in text:
                  raise SystemExit('Expected og:image not found; refusing to insert social metadata')
              text = text.replace(image_line, social_block, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit metadata update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update homepage share title"
          git push origin HEAD:main
