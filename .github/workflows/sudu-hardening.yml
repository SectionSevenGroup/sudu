name: SuDu hardening follow-up

on:
  push:
    branches:
      - claude/sudu-hardening-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[post-hardening-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply post-hardening consistency fixes
        run: node scripts/apply-post-hardening.mjs
      - name: Commit follow-up output
        run: |
          if git diff --quiet; then
            echo "No follow-up changes produced."
            exit 0
          fi
          git config user.name "sudu-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish SuDu hardening [post-hardening-output]"
          git push
