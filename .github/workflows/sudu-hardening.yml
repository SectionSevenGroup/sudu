name: SuDu hardening pass

on:
  push:
    branches:
      - claude/sudu-hardening-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved SuDu hardening
        run: node scripts/apply-site-hardening.mjs
      - name: Commit generated hardening output
        run: |
          if git diff --quiet; then
            echo "No hardening changes produced."
            exit 0
          fi
          git config user.name "sudu-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply SuDu hardening [hardening-output]"
          git push
