# DIAGNOSTIC ONLY — delete this file before PR #7 merges.
#
# Probes the PR #6 deploy preview from a GitHub runner, which has the
# unrestricted egress the dev sandbox does not. The question it answers: does
# Netlify's pretty_urls setting 301 the four SEO landing pages off the .html
# URLs they declare as canonical?
#
# workflow_dispatch only fires for workflows already on the default branch, so
# a push trigger scoped to this branch is included to make the first run happen
# without committing anything to main.

name: Check redirects (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [claude/studio-fit-and-fixes-uhnpgt]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the PR #6 deploy preview
        run: |
          BASE=https://deploy-preview-6--sudustudioarchitecture.netlify.app
          echo "BASE=$BASE"

          # GET rather than HEAD, so the result matches what a browser or a
          # crawler would actually see. No -L: the redirect itself is the data.
          probe() {
            printf '\n--- %s\n' "$1"
            curl -sS -o /dev/null -D - --max-time 30 "$BASE$1" \
              | tr -d '\r' \
              | grep -iE '^(HTTP/|location:)' \
              | sed 's/^/    /' \
              || echo '    (no status or location captured)'
          }

          echo
          echo "########## the four SEO landing pages ##########"
          probe /custom-home-design-edmonton.html
          probe /renovations-additions-edmonton.html
          probe /restaurant-hospitality-design-edmonton.html
          probe /commercial-retail-design-edmonton.html

          echo
          echo "########## project + work ##########"
          probe "/project.html?p=west-vancouver"
          probe /work.html

          echo
          echo "########## legacy Squarespace paths (extensionless) ##########"
          for u in /home /about /projects /contact-us /services /portfolio /sudu-services; do
            probe "$u"
          done

          echo
          echo "########## legacy Squarespace paths (.html twins) ##########"
          for u in /home.html /about.html /projects.html /contact-us.html /services.html /portfolio.html /sudu-services.html; do
            probe "$u"
          done

          echo
          echo "########## do the redirect TARGETS resolve? ##########"
          # The canonicals changed in PR #6 point at these extensionless URLs,
          # and every Squarespace rule above redirects into them, so they have
          # to return 200 rather than 404.
          for u in / /studio /contact /work /work/ /work/west-vancouver/ \
                   /custom-home-design-edmonton /studio.html /contact.html; do
            probe "$u"
          done
