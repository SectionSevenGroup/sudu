name: One-off homepage document title update

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-document-title.yml'

permissions:
  contents: write

jobs:
  patch-homepage-document-title:
    if: github.event.head_commit.message == 'chore: one-off update document title'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document title only
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<title>SuDu Studio | Architecture + Interior Design | Edmonton, Alberta</title>'
          new = '<title>SuDu Studio Architecture</title>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected homepage title not found; refusing to edit')
          path.write_text(text, encoding='utf-8')
      - name: Commit title update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update homepage document title"
          git push origin HEAD:main
