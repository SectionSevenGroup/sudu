name: Update Joe title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-joe-title.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update title and translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          studio = Path('studio.html')
          text = studio.read_text(encoding='utf-8')
          old = "joeRole: 'Designer + Design Director',"
          new = "joeRole: 'Creative Director',"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one studio title occurrence, found {text.count(old)}')
          studio.write_text(text.replace(old, new), encoding='utf-8')

          i18n = Path('i18n.js')
          text = i18n.read_text(encoding='utf-8')
          replacements = [
              ('Designer + Design Director', 'Creative Director'),
              ('Designer + Directeur de design', 'Directeur de création'),
              ('Diseñador + Director de diseño', 'Director creativo'),
              ('Designer + Designdirektor', 'Kreativdirektor'),
              ('デザイナー／デザインディレクター', 'クリエイティブディレクター'),
          ]
          for old_text, new_text in replacements:
              if old_text not in text:
                  raise SystemExit(f'Missing expected i18n text: {old_text}')
              text = text.replace(old_text, new_text)
          i18n.write_text(text, encoding='utf-8')

          if 'Designer + Design Director' in studio.read_text(encoding='utf-8'):
              raise SystemExit('Old title remains in studio.html')
          if 'Designer + Design Director' in i18n.read_text(encoding='utf-8'):
              raise SystemExit('Old title remains in i18n.js')
          PY

      - name: Commit site update and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-joe-title.yml
          git add studio.html i18n.js
          git commit -m "Update Joe title to Creative Director"
          git push origin HEAD:main
