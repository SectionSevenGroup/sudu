<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>STACK — SuDu Studio</title>
  <meta name="description" content="STACK, an interactive architectural study by SuDu Studio.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://sudu.studio/stack">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/stack/stack.css">
</head>
<body>
  <main class="stack-study" aria-labelledby="stack-title">
    <header class="stack-header">
      <a class="stack-mark" href="/" aria-label="SuDu Studio home"><img src="/images/sudu-mark.png" alt="SuDu Studio"></a>
      <h1 id="stack-title" class="play-switch">
        <a href="/stack" aria-current="page">STACK</a>
        <span aria-hidden="true">/</span>
        <a href="/play/massing/">MASSING</a>
      </h1>
    </header>

    <div id="stack-stage" class="stack-stage" aria-label="Interactive block tower. Pull from an end to extract, use a side to nudge laterally, and lift a free block toward the guide at the top." tabindex="0">
      <p class="stack-loading" aria-live="polite">assembling</p>
    </div>

    <div class="stack-note" aria-live="polite">
      <span id="move-count"></span>
      <button id="stack-help" class="stack-help" type="button" aria-label="Show controls">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h14"/>
          <path class="stack-help-accent" d="M17 7h2M5 12h2M10 17h4"/>
        </svg>
      </button>
      <button id="again" type="button">reset</button>
    </div>
    <p class="stack-instruction">pull clear · keep holding</p>

    <section id="stack-intro" class="stack-intro is-open" aria-label="Stack controls" aria-modal="true" role="dialog">
      <div class="stack-intro-set" aria-hidden="true">
        <svg class="stack-cue stack-cue-end" viewBox="0 0 240 160">
          <g class="cue-block">
            <path class="cue-top" d="M55 61 71 47h112l-16 14Z"/>
            <path class="cue-side" d="M55 61h112v42H55Z"/>
            <path class="cue-face cue-accent" d="m167 61 16-14v42l-16 14Z"/>
          </g>
          <g class="cue-chevron cue-chevron-x">
            <path d="m192 68 10 7-10 7"/>
            <path d="m207 68 10 7-10 7"/>
            <path class="cue-faint" d="m151 68-10 7 10 7"/>
          </g>
        </svg>

        <svg class="stack-cue stack-cue-side" viewBox="0 0 240 160">
          <g class="cue-block">
            <path class="cue-top" d="M55 61 71 47h112l-16 14Z"/>
            <path class="cue-side cue-accent" d="M55 61h112v42H55Z"/>
            <path class="cue-face" d="m167 61 16-14v42l-16 14Z"/>
          </g>
          <g class="cue-chevron cue-chevron-y">
            <path d="m103 38 7-10 7 10"/>
            <path d="m103 117 7 10 7-10"/>
          </g>
        </svg>

        <svg class="stack-cue stack-cue-top" viewBox="0 0 240 160">
          <g class="cue-ghost" transform="translate(0 -24)">
            <path d="M55 61 71 47h112l-16 14Z"/>
            <path d="M55 61h112v42H55Z"/>
            <path d="m167 61 16-14v42l-16 14Z"/>
          </g>
          <g class="cue-block">
            <path class="cue-top cue-accent" d="M55 85 71 71h112l-16 14Z"/>
            <path class="cue-side" d="M55 85h112v42H55Z"/>
            <path class="cue-face" d="m167 85 16-14v42l-16 14Z"/>
          </g>
          <g class="cue-chevron cue-chevron-up">
            <path d="m103 61 7-10 7 10"/>
            <path d="M110 51v18"/>
          </g>
        </svg>
      </div>

      <button id="stack-start" class="stack-start" type="button" aria-label="Start STACK">
        <svg viewBox="0 0 42 42" aria-hidden="true">
          <path d="m16 12 10 9-10 9"/>
          <path d="m23 12 10 9-10 9"/>
        </svg>
      </button>
    </section>
  </main>

  <script src="/stack/intro.js" defer></script>
  <script type="module" src="/stack/stack.js"></script>
</body>
</html>
