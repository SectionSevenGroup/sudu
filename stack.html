<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>STACK — SuDu Studio</title>
  <meta name="description" content="STACK, an interactive architectural study by SuDu Studio.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://sudu.studio/stack">
  <link rel="icon" href="/favicon.ico">
  <link rel="preload" href="/fonts/galano-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/stack/stack.css">
  <script type="importmap">
  {
    "imports": {
      "https://esm.sh/three@0.180.0": "/stack/vendor/three-shim.js",
      "https://esm.sh/@dimforge/rapier3d-compat@0.19.0": "/stack/vendor/rapier-shim.js"
    }
  }
  </script>
</head>
<body>
  <main class="stack-study" aria-labelledby="stack-title">
    <header class="stack-header">
      <a class="stack-mark" href="/" aria-label="SuDu Studio home"><img src="/images/sudu-mark.png" alt="SuDu Studio"></a>
      <h1 id="stack-title">STACK</h1>
    </header>
    <div id="stack-stage" class="stack-stage" aria-label="Interactive block tower. Pull a block fully clear, keep holding to lift it toward the guide at the top, then release to place it. Detached blocks can be picked up again. Use the wheel or trackpad to zoom." tabindex="0">
      <p class="stack-loading" aria-live="polite">assembling</p>
    </div>
    <div class="stack-note" aria-live="polite"><span id="move-count"></span><button id="again" type="button">reset</button></div>
    <p class="stack-instruction">pull clear · keep holding</p>
  </main>
  <script type="module" src="/stack/stack.js"></script>
</body>
</html>
