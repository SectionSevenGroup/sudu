<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// GitHub Pages has no server redirects: normalize /page.html to the clean URL client-side.
(function(){if(location.protocol.indexOf('http')!==0)return;var p=location.pathname;if(/\.html$/.test(p)){var t=/(^|\/)index\.html$/.test(p)?p.replace(/index\.html$/,''):p.replace(/\.html$/,'');location.replace(t+location.search+location.hash);}})();
</script>
<title>Work · SuDu Studio</title>
<meta name="description" content="Selected architecture and interiors projects from SuDu Studio, including West Vancouver, Wilfred’s, ATB Place and the Youth Recovery Centre.">
<link rel="canonical" href="https://sudu.studio/work">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SuDu Studio">
<meta property="og:title" content="Work · SuDu Studio">
<meta property="og:description" content="Selected architecture and interiors projects from SuDu Studio, including West Vancouver, Wilfred’s, ATB Place and the Youth Recovery Centre.">
<meta property="og:url" content="https://sudu.studio/work">
<meta property="og:image" content="https://sudu.studio/images/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<script src="./js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html { background: #F3F1EA; }
  body { margin: 0; background: #F3F1EA; color: #171613; font-family: 'Urbanist', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #E17B3E; }
  ::selection { background: #E17B3E; color: #F3F1EA; }
  :focus-visible { outline: 2px solid #E17B3E; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</helmet>

<div style="background:#F3F1EA; color:#171613; font-family:'Urbanist', sans-serif;">

  <header style="position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:34px clamp(20px,4.5vw,64px) 30px; background:rgba(243,241,234,0.94); border-bottom:1px solid rgba(23,22,19,0.13);">
    <a href="/" style="display:flex; align-items:flex-end; gap:12px;">
      <img src="images/sudu-mark.png" alt="SuDu Studio" width="1856" height="660" decoding="async" style="height:38px; width:auto; display:block;">
    </a>
    <nav style="display:flex; align-items:flex-end; gap:clamp(16px,2.6vw,30px);">
      <a href="/work" style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid #171613;">Work</a>
      <a href="/studio" style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid transparent; transition:border-color .3s ease, color .3s ease;" style-hover="border-bottom-color:#E17B3E; color:#E17B3E;">Studio</a>
      <a href="/contact" style="font-size:13px; font-weight:500; line-height:1.4; padding-bottom:2px; border-bottom:1px solid transparent; transition:border-color .3s ease, color .3s ease;" style-hover="border-bottom-color:#E17B3E; color:#E17B3E;">Contact</a>
    </nav>
  </header>

  <section data-screen-label="Work Index" style="padding:clamp(104px,13vh,140px) clamp(20px,4.5vw,64px) clamp(40px,5vw,64px);">
    <div style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; padding-bottom:clamp(24px,3vw,36px);">
      <h1 style="margin:0; font-size:clamp(28px,3.8vw,46px); font-weight:700; letter-spacing:-0.035em; line-height:1.0;">Work</h1>
      <span style="font-family:'Urbanist', sans-serif; font-size:11px; font-weight:500; letter-spacing:0.08em; color:#A6A399;">14 projects</span>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:40px 28px; border-top:1px solid rgba(23,22,19,0.13); padding-top:clamp(28px,3.5vw,44px);">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" style="display:block;">
          <div style="aspect-ratio:4/3; overflow:hidden; background:#E8E5DC;">
            <img src="{{ it.thumb }}" alt="{{ it.title }}" width="{{ it.w }}" height="{{ it.h }}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover; display:block; transition:transform .8s cubic-bezier(.16,1,.3,1);" style-hover="transform:scale(1.05);">
          </div>
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px;">
            <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:#A6A399;">{{ it.eyebrow }}</span>
            <span style="font-family:'Urbanist', sans-serif; font-size:10px; font-weight:500; color:#A6A399;">{{ it.num }}</span>
          </div>
          <div style="margin-top:6px; font-size:17px; font-weight:600; letter-spacing:-0.015em; line-height:1.1;">{{ it.title }}</div>
          <dl style="margin:8px 0 0; display:flex; flex-direction:column; gap:3px;">
            <div style="display:flex; align-items:baseline; gap:10px;">
              <dt style="margin:0; flex:none; width:52px; font-family:'Urbanist', sans-serif; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#A6A399;">Location</dt>
              <dd style="margin:0; font-family:'Urbanist', sans-serif; font-size:11px; color:#67655D;">{{ it.location }}</dd>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px;">
              <dt style="margin:0; flex:none; width:52px; font-family:'Urbanist', sans-serif; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#A6A399;">Scope</dt>
              <dd style="margin:0; font-family:'Urbanist', sans-serif; font-size:11px; color:#67655D;">{{ it.scope }}</dd>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px;">
              <dt style="margin:0; flex:none; width:52px; font-family:'Urbanist', sans-serif; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#A6A399;">Status</dt>
              <dd style="margin:0; font-family:'Urbanist', sans-serif; font-size:11px; color:#67655D;">{{ it.status }}</dd>
            </div>
          </dl>
        </a>
      </sc-for>
    </div>
  </section>

  <a href="/contact" style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 32px; padding:clamp(40px,5vw,64px) clamp(20px,4.5vw,64px); border-top:1px solid rgba(23,22,19,0.13); transition:background .35s ease;" style-hover="background:#E8E5DC;">
    <div>
      <div style="font-family:'Urbanist', sans-serif; font-size:10.5px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:#67655D; margin-bottom:14px;">Start a project</div>
      <div style="font-size:clamp(24px,3vw,38px); font-weight:700; letter-spacing:-0.03em; line-height:1;">Say hello</div>
    </div>
    <span style="font-size:clamp(19px,2.3vw,30px); font-weight:700; color:#E17B3E; line-height:1; letter-spacing:-0.12em;">&#8250;&#8250;</span>
  </a>

  <footer style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px 24px; padding:20px clamp(20px,4.5vw,64px) 28px; border-top:1px solid rgba(23,22,19,0.13); font-family:'Urbanist', sans-serif; font-size:10.5px; color:#A6A399;">
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="images/sudu-mark.png" alt="SuDu Studio" width="1856" height="660" loading="lazy" decoding="async" style="height:19px; width:auto; display:block; opacity:0.85;">
      <span style="width:1px; height:14px; background:rgba(23,22,19,0.22);"></span>
      <span>&copy; 2026 SuDu Studio</span>
    </div>
    <span>Alberta</span>
  </footer>

</div>

</x-dc>

</script>
</body>
</html>
