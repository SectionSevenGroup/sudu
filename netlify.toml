# Netlify configuration for the sudustudioarchitecture site.
# The site is static with no build step, so the repository root is published
# as-is and _redirects sits alongside this file at the publish root.

[build]
  publish = "."

[build.processing]
  skip_processing = false

# pretty_urls issues the .html -> extensionless 301 (and /path/index.html ->
# /path/), which is why _redirects carries no /*.html splat rule.
[build.processing.html]
  pretty_urls = true

# --- contact form -----------------------------------------------------------
# The enquiry form on contact.html is a Netlify form (name="contact"). It is
# declared in the static HTML, which is what Netlify scans at deploy time, and
# submitted over fetch so the visitor never leaves the page. It posts to "/"
# rather than to its own URL because pretty_urls 301s /contact.html and a
# redirected POST is downgraded to a GET; no rule in _redirects matches "/" on
# the apex host, so the POST reaches the form handler. skip_processing above
# must stay false or the deploy is never scanned for forms.
#
# TWO DASHBOARD SETTINGS ARE NOT CONFIGURED BY THIS REPOSITORY. They are site
# settings, so they have to be set once in Netlify. They fail differently:
#
#   1. FORM DETECTION - required before the form works at all.
#      Site configuration -> Forms -> enable form detection. It is off by
#      default on sites created since ~mid-2024. Detection only scans HTML at
#      deploy time, so if it is switched on after this merge, trigger a fresh
#      deploy ("Clear cache and deploy site") to register the form.
#      Confirm: the Forms tab lists a form named "contact".
#      Until this is done Netlify does not recognise the form and rejects the
#      POST, so the enquiry is not stored. The page shows its error state and
#      points the visitor at joe@sudu.studio, so nothing fails silently to
#      them, but the enquiry does not reach the studio.
#
#   2. FORM STORAGE - automatic once detection is on.
#      With the "contact" form registered, verified (non-spam) submissions are
#      stored in Netlify Forms and readable in the dashboard. Nothing to set.
#
#   3. EMAIL NOTIFICATION - strongly wanted operationally, but not a data-loss
#      risk. Site configuration -> Notifications -> Emails and webhooks -> add
#      a "Form submission" notification for the "contact" form to
#      joe@sudu.studio. Without it submissions are still stored under (2); the
#      only thing missing is the alert, so enquiries can sit unread rather
#      than being lost.
#
# Spam: the form carries a honeypot (netlify-honeypot="bot-field"); Netlify's
# own filtering is on top of that. The free tier caps submissions per month.
